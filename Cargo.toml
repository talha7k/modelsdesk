[package]
name = "modeldesk"
version = "0.1.0"
edition = "2021"
description = "Local LLM model manager for Mac (provider-agnostic core, macOS first)"
license = "GPL-3.0-or-later"
repository = "https://github.com/talha7k/modeldesk"
homepage = "https://github.com/talha7k/modeldesk"
documentation = "https://github.com/talha7k/modeldesk/blob/main/README.md"

[[bin]]
name = "modeldesk"
path = "src/main.rs"

[lib]
name = "modeldesk"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
console = "0.15"
crossterm = "0.28"
dirs = "6"
indicatif = "0.17"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
strip = true
